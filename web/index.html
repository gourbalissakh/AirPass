<!doctype html>
<html lang="fr" data-theme="sombre">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1f" />
    <meta
      name="description"
      content="Envol — enregistrez-vous en ligne sur les vols Air Burkina, choisissez votre siège sur le plan réel de la cabine et recevez votre carte d'embarquement avant d'arriver à l'aéroport."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Envol — l'envol commence ici" />
    <meta
      property="og:description"
      content="L'enregistrement en ligne des passagers Air Burkina : votre siège, vos bagages et votre carte d'embarquement, avant l'aéroport."
    />
    <meta property="og:image" content="/images/hero/air-burkina.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <title>Envol — Enregistrement en ligne Air Burkina</title>

    <script>
      // Applique le thème avant le premier rendu : évite le flash de couleur.
      (function () {
        try {
          var t = localStorage.getItem('envol.theme');
          if (!t) {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'clair' : 'sombre';
          }
          document.documentElement.dataset.theme = t;
          document
            .querySelector('meta[name=theme-color]')
            .setAttribute('content', t === 'clair' ? '#fbf8f3' : '#0a0f1f');
        } catch (e) { /* stockage indisponible : on garde le thème sombre */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
