server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # L'application est une SPA : toute route inconnue retombe sur index.html
    # pour que React Router prenne la main.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
